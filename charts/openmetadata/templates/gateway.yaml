{{- if .Values.gateway.enabled }}
{{- $fullName := include "OpenMetadata.fullname" . }}
{{- $svcPort := .Values.service.port }}
{{- if semverCompare ">=1.0.0-0" (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute" | ternary "1.0.0" "0.0.0") }}
apiVersion: gateway.networking.k8s.io/v1
{{- else if semverCompare ">=1.0.0-0" (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1beta1/HTTPRoute" | ternary "1.0.0" "0.0.0") }}
apiVersion: gateway.networking.k8s.io/v1beta1
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
{{- end }}
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "OpenMetadata.labels" . | indent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gateway.parentRefs }}
    - name: {{ required "gateway.parentRefs[].name is required" .name | quote }}
      {{- with .group }}
      group: {{ . | quote }}
      {{- end }}
      {{- with .kind }}
      kind: {{ . }}
      {{- end }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.gateway.rules }}
    {{- range .Values.gateway.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .backendRefs }}
        {{- toYaml .backendRefs | nindent 8 }}
        {{- else }}
        - name: {{ $fullName }}
          port: {{ $svcPort }}
        {{- end }}
    {{- end }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
    {{- end }}
{{- end }}
